<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>翻译服务设置</title><link rel="stylesheet" href="style.css"><body><main><h1>翻译服务设置</h1><p>页面文本会发送到当前选择的供应商。API Key 保存在此浏览器的扩展本地存储中，请保护本机数据。</p><label>当前供应商<select id="provider"><option value="deepseek">DeepSeek</option><option value="openai">OpenAI</option><option value="custom">自定义（OpenAI 兼容接口）</option></select></label><label>API 地址<input id="url" type="url" placeholder="https://api.deepseek.com/v1"></label><label>模型名称<input id="model" placeholder="deepseek-chat"></label><label>API Key<input id="key" type="password" autocomplete="off"></label><button id="save">保存并启用</button><p id="status" role="status" aria-live="polite"></p><p>原型仅手动翻译，每次最多处理 200 段。请勿将密钥提交到仓库。</p></main><script src="core.js"></script><script src="options.js"></script></body></html>
